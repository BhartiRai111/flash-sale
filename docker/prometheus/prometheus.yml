global:
  scrape_interval: 10s

scrape_configs:
  - job_name: flash-sale-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - order-service:8081
          - inventory-service:8082
          - payment-service:8083
          - notification-service:8084
          - web-ui:8090
