# Start everything:   docker compose up -d --build
# Infra only (run services from IntelliJ):   docker compose up -d postgres redis kafka mailhog prometheus grafana

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  DB_USER: flashsale
  DB_PASSWORD: flashsale

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"   # for apps running on your machine (IntelliJ)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller     # KRaft mode, no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web inbox -> http://localhost:8025

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"     # http://localhost:3000  (admin / admin)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ------------------------------------------------------------------ microservices
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH:-5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on: *depends-infra

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
    depends_on: *depends-infra

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.1}
    depends_on: *depends-infra

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    ports:
      - "8084:8084"
    environment:
      <<: *service-env
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

  # ------------------------------------------------------------------ frontend
  web-ui:
    build:
      context: .
      args:
        MODULE: web-ui
    ports:
      - "8090:8090"     # open http://localhost:8090
    environment:
      GATEWAY_URL: http://api-gateway:8080
      THYMELEAF_CACHE: "true"
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata   # order times shown in IST
    depends_on:
      - api-gateway

volumes:
  postgres-data:
