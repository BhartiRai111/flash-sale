<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Admin', false)}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <h1>Admin · Products</h1>
        <p class="muted">Only users with the ADMIN role (from the JWT) can create products or add stock.</p>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="admin-layout">
        <div class="card table-card">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th class="num">Price</th>
                    <th class="num">Stock</th>
                    <th>Add stock</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id()}">1</td>
                    <td th:text="${p.name()}">Name</td>
                    <td class="num" th:text="'₹' + ${#numbers.formatDecimal(p.price(), 1, 'COMMA', 2, 'POINT')}">₹0</td>
                    <td class="num">
                        <span th:text="${p.availableStock()}">0</span>
                        <span th:if="${p.soldOut()}" class="badge danger">Sold out</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/products/{id}/restock(id=${p.id()})}"
                              method="post" class="inline-form">
                            <input type="number" min="1" name="quantity" placeholder="Qty"
                                   th:attr="aria-label='Add stock to ' + ${p.name()}" required>
                            <button type="submit" class="button small">Add</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <form th:action="@{/admin/products}" th:object="${productForm}" method="post" class="card form">
            <h2>New product</h2>

            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="price">Price (₹)</label>
            <input id="price" type="number" step="0.01" min="0.01" th:field="*{price}">
            <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

            <label for="stock">Stock</label>
            <input id="stock" type="number" min="0" th:field="*{stock}">
            <p class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>

            <button type="submit" class="button">Create product</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
