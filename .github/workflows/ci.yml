name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker daemon that GitHub runners already have
      - name: Build and run all tests
        run: mvn -B verify

      - name: Build Docker images
        run: docker compose build
