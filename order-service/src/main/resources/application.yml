server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orderdb}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    producer:
      acks: all

inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

outbox:
  poll-interval-ms: 500

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        ignore-exceptions:
          - com.bharti.flashsale.order.exception.OrderExceptions$ProductNotFoundException
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        ignore-exceptions:
          - com.bharti.flashsale.order.exception.OrderExceptions$ProductNotFoundException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
